syntax = "proto3";

package api.wafTop.v1;

option go_package = "wafconsole/api/wafTop/v1;v1";
option java_multiple_files = true;
option java_package = "api.wafTop.v1";

import "v1/message.proto";
import "google/api/annotations.proto";


service ServerPrincipal {
	rpc GetServerPrincipalByServerId (GetServerPrincipalRequest) returns (GetServerPrincipalReply) {
		option (google.api.http) = {
			get: "/app/waf_top/v1/server_principal"
		};
	};
	rpc CreateServerPrincipal (CreateServerPrincipalRequest) returns (CreateServerPrincipalReply) {
		option (google.api.http) = {
			post: "/app/waf_top/v1/server_principal"
			body: "*"
		};
	};
	rpc UpdateServerPrincipal (UpdateServerPrincipalRequest) returns (UpdateServerPrincipalReply) {
		option (google.api.http) = {
			put: "/app/waf_top/v1/server_principal/{id}"
			body: "*"
		};
	};
	rpc DeleteServerPrincipal (DeleteServerPrincipalRequest) returns (DeleteServerPrincipalReply) {
		option (google.api.http) = {
			delete: "/app/waf_top/v1/server_principal"
		};
	}
}