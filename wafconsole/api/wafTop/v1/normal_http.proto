syntax = "proto3";

package api.wafTop.v1;

option go_package = "wafconsole/api/wafTop/v1;v1";
option java_multiple_files = true;
option java_package = "api.wafTop.v1";

import "api/wafTop/v1/message.proto";

service NormalHttp {
	rpc CreateNormalHttp (CreateNormalHttpRequest) returns (CreateNormalHttpReply);
	rpc UpdateNormalHttp (UpdateNormalHttpRequest) returns (UpdateNormalHttpReply);
	rpc DeleteNormalHttp (DeleteNormalHttpRequest) returns (DeleteNormalHttpReply);
	rpc GetNormalHttp (GetNormalHttpRequest) returns (GetNormalHttpReply);
	rpc ListNormalHttp (ListNormalHttpRequest) returns (ListNormalHttpReply);
}

