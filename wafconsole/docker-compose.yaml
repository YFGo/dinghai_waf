version: '3'networks:  backend:    driver: bridgeservices:  waf-top:    build:      context: app/wafTop      dockerfile: Dockerfile    container_name: waf-top    restart: always    environment:      - TZ=Asia/Shanghai    privileged: true    ports:      - "8007:8001"      - "9003:9001"    networks:      - backend  waf-user:    build:      context: app/user      dockerfile: Dockerfile    container_name: waf-user    restart: always    environment:      - TZ=Asia/Shanghai    privileged: true    ports:      - "8002:8002"      - "9004:9002"    networks:      - backend  waf-dashboard:    build:      context: app/dashBorad      dockerfile: Dockerfile    container_name: waf-dashboard    restart: always    environment:      - TZ=Asia/Shanghai    privileged: true    ports:      - "8003:8003"      - "9006:9006"    networks:      - backend  waf-cron:    build:      context: app/cron      dockerfile: Dockerfile    container_name: waf-cron    restart: always    environment:      - TZ=Asia/Shanghai    privileged: true    ports:      - "8000:8000"      - "9008:9000"    networks:      - backend    depends_on:      - waf-top      - waf-user      - waf-dashboard