syntax = "proto3";
package kratos.api;

option go_package = "wafconsole/app/user/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Trace trace = 3;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Mysql {
    string host = 1;
    int32 port = 2;
    string user = 3;
    string password = 4;
    string db = 5;
    int32 max_idle = 6;
    int32 max_open = 7;
  }
  message Redis {
    string addr = 1;
    int64 db = 2;
    string password = 3;
    google.protobuf.Duration read_timeout = 4;
    google.protobuf.Duration write_timeout = 5;
  }
  message Email {
    string smtp_server = 1;
    string smtp_port = 2;
    string smtp_user_name = 3;
    string smtp_password = 4;
  }
  Mysql mysql = 1;
  Redis redis = 2;
  Email email = 3;
}

message Trace {
  string endpoint = 1;
}
